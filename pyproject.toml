[project]
name = "churn-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tenochca", email = "tenochca.di@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
churn-mlops = "churn_mlops:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "euporie>=2.10.4",
    "ipykernel>=7.4.0",
]
